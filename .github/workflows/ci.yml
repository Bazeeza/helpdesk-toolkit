name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      # Same script as on a workstation, see Invoke-Tests.ps1
      - name: Analyze
        shell: pwsh
        run: ./Invoke-Tests.ps1 -Task Analyze

  test:
    name: Pester (${{ matrix.shell }})
    # The module reads Windows information (CIM, registry), so tests run on Windows.
    # powershell = Windows PowerShell 5.1, the shell of every workstation
    # pwsh       = PowerShell 7
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # Windows ships Pester 3.4; the tests need Pester 5. Major version 6
      # is excluded until the tests are checked against it.
      - name: Install Pester 5
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck
          $PSVersionTable.PSVersion

      - name: Run tests
        run: ./Invoke-Tests.ps1 -Task Test -Verbosity Detailed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.shell }}
          path: testResults.xml
          if-no-files-found: ignore
